name: Git Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Deployment itself lives in Karasu-Lab/WorkersDeploy: it deploys this
# app standalone from this repository, detects the ElysiaJS project,
# builds it with Vite, and deploys it to Cloudflare Workers.

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - env:
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
        run: |
          if [ -z "$STORAGE_BUCKET" ]; then
            echo "The STORAGE_BUCKET repository variable is not set."
            exit 1
          fi
          set +e
          OUTPUT=$(npx --yes wrangler@4.155.0 r2 bucket create "$STORAGE_BUCKET" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -qi "already exists"; then
            echo "The R2 bucket $STORAGE_BUCKET already exists; continuing."
            exit 0
          fi
          echo "Creating the R2 bucket $STORAGE_BUCKET failed with exit code $STATUS."
          exit "$STATUS"
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: git-karasu256-com
          secret-names: INTERNAL_API_SECRET STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY STORAGE_BUCKET STORAGE_ENDPOINT
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: preview
          worker-name: git-karasu256-com
          secret-names: INTERNAL_API_SECRET STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY STORAGE_BUCKET STORAGE_ENDPOINT
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
